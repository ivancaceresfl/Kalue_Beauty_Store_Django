<!DOCTYPE html>
<html lang="es">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Kalué</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>
<body style="display:flex; align-items:center; justify-content:center;
             min-height:100vh; background:#f8f0f3">

    <div style="background:white; padding:40px; border-radius:16px;
                box-shadow:0 4px 20px rgba(0,0,0,0.1); width:100%; max-width:380px">

        <div style="text-align:center; margin-bottom:30px">
            <h1 style="font-family:'Playfair Display',serif; color:var(--rosa-oscuro)">
                ✨ Kalué
            </h1>
            <p style="color:var(--gris)">Panel de administración</p>
        </div>

        {% if messages %}
        {% for message in messages %}
        <div class="alert" style="background:#fde8e8; color:#c0392b">
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label style="display:block; font-weight:600; color:var(--rosa-oscuro);
                          margin-bottom:6px">Usuario</label>
            <input type="text" name="username" required
                   style="width:100%; padding:12px; border:2px solid var(--rosa);
                          border-radius:10px; font-size:1rem; margin-bottom:16px;
                          box-sizing:border-box; outline:none">

            <label style="display:block; font-weight:600; color:var(--rosa-oscuro);
                          margin-bottom:6px">Contraseña</label>
            <input type="password" name="password" required
                   style="width:100%; padding:12px; border:2px solid var(--rosa);
                          border-radius:10px; font-size:1rem; margin-bottom:24px;
                          box-sizing:border-box; outline:none">

            <button type="submit"
                    style="width:100%; padding:14px; background:var(--rosa-oscuro);
                           color:white; border:none; border-radius:10px;
                           font-size:1rem; cursor:pointer">
                Entrar
            </button>
        </form>

        <div style="text-align:center; margin-top:20px">
            <a href="{% url 'index' %}"
               style="color:var(--gris); font-size:0.85rem; text-decoration:none">
                ← Ver tienda
            </a>
        </div>

    </div>

</body>
</html>
